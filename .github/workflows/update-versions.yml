name: Update Nvidia Driver versions

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Sync driver versions from Unraid upstream
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import re
          from urllib.request import urlopen

          url = 'https://raw.githubusercontent.com/unraid/unraid-nvidia-driver/master/versions.json'
          with urlopen(url, timeout=30) as response:
              content = response.read()
          data = json.loads(content)
          versions = [data['branches'][key]['current'] for key in ('production', 'newfeature', 'beta', 'legacy')]
          versions += [data['runtimes'][key]['current'] for key in ('containertoolkit', 'libnvidia')]
          if not all(re.fullmatch(r'[0-9]+(?:\.[0-9]+)+', version) for version in versions):
              raise ValueError('Upstream versions.json contains an invalid version')
          Path('versions.json').write_bytes(content)
          print('Synced driver and container runtime versions from Unraid upstream')
          PY

      - name: Commit changed version metadata
        run: |
          if git diff --quiet -- versions.json; then
            echo "Version metadata is already up to date"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add versions.json
          git commit -m "Sync Nvidia driver versions from upstream"
          git push origin "HEAD:${GITHUB_REF_NAME}"
